<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองห้องประชุม</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">จองห้องประชุม</h1>
    <div id="user-info" class="text-sm text-gray-500 mb-6">กำลังโหลดข้อมูลผู้ใช้...</div>

    <form id="booking-form" class="space-y-4">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700">หัวข้อการประชุม</label>
        <input type="text" id="title" required placeholder="เช่น ประชุมวางแผนทีม" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <div>
        <label for="room_id" class="block text-sm font-medium text-gray-700">เลือกห้องประชุม</label>
        <select id="room_id" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400" required>
          <option value="R1">ห้องทุ่งรวงเงิน (ห้องเล็ก)</option>
          <option value="R2">ห้องทุ่งรวงทอง (ห้องใหญ่)</option>
          <option value="R_ALL">ห้องทุ่งประกายเพชร (รวมห้อง 1 + 2)</option>
        </select>
      </div>

      <div>
        <label for="booking_date" class="block text-sm font-medium text-gray-700">วันที่</label>
        <input type="date" id="booking_date" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="start_time_select" class="block text-sm font-medium text-gray-700">เวลาเริ่ม (24 ชม.)</label>
          <select id="start_time_select" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400">
            <option value="">-- เลือก --</option>
          </select>
        </div>
        <div>
          <label for="end_time_select" class="block text-sm font-medium text-gray-700">เวลาสิ้นสุด (24 ชม.)</label>
          <select id="end_time_select" required class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400">
            <option value="">-- เลือก --</option>
          </select>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-semibold py-3 rounded-lg shadow transition mt-2">
        ยืนยันการจอง
      </button>
    </form>
  </div>

  <script>
    const MY_LIFF_ID = "2012070438-neRmVlKc";
    let currentUser = null;

    // 1. ฟังก์ชันสร้างตัวเลือกเวลา 08:00 - 20:00 น. (ล็อกนาที 00 และ 30)
    function populateTimeOptions() {
      const startSelect = document.getElementById('start_time_select');
      const endSelect = document.getElementById('end_time_select');
      const times = [];

      for (let h = 8; h <= 20; h++) {
        const hh = String(h).padStart(2, '0');
        times.push(`${hh}:00`);
        if (h < 20) {
          times.push(`${hh}:30`);
        }
      }

      times.forEach(t => {
        startSelect.add(new Option(`${t} น.`, t));
        endSelect.add(new Option(`${t} น.`, t));
      });
    }

    // 2. ฟังก์ชันกำหนดวันที่เริ่มต้นเป็นเวลาปัจจุบันในไทย
    function setDefaultDate() {
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
      document.getElementById('booking_date').value = today;
    }

    // 3. เริ่มต้นเชื่อมต่อ LINE LIFF
    async function init() {
      populateTimeOptions();
      setDefaultDate();

      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        currentUser = await liff.getProfile();
        document.getElementById('user-info').innerText = `👤 ผู้จอง: "${currentUser.displayName}"`;
      } catch (err) {
        document.getElementById('user-info').innerText = `เข้าสู่ระบบ LINE ไม่สำเร็จ: ${err.message}`;
      }
    }

    // 4. จัดการการกดปุ่มส่งข้อมูลจองห้อง
    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return alert('กรุณารอโหลดข้อมูลผู้ใช้สักครู่');

      const date = document.getElementById('booking_date').value;
      const startTime = document.getElementById('start_time_select').value;
      const endTime = document.getElementById('end_time_select').value;

      if (!startTime || !endTime) {
        alert('กรุณาเลือกเวลาเริ่มและเวลาสิ้นสุด');
        return;
      }

      if (startTime >= endTime) {
        alert('เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น');
        return;
      }

      // ล็อก Timezone ประเทศไทย (+07:00) ให้เวลาตรงกันทุกเครื่อง
      const fullStartTime = `${date}T${startTime}:00+07:00`;
      const fullEndTime = `${date}T${endTime}:00+07:00`;

      const payload = {
        user_line_id: currentUser.userId,
        user_name: currentUser.displayName,
        room_id: document.getElementById('room_id').value,
        title: document.getElementById('title').value,
        start_time: fullStartTime,
        end_time: fullEndTime
      };

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'กำลังตรวจสอบห้อง...';

      try {
        const res = await fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'เกิดข้อผิดพลาดในการจอง');
        } else {
          alert('✅ จองห้องสำเร็จ! ข้อความยืนยันถูกส่งไปยังแชต LINE ของคุณแล้ว');
          if (typeof liff !== 'undefined' && liff.closeWindow) {
            liff.closeWindow();
          }
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
      } finally {
        btn.disabled = false;
        btn.innerText = 'ยืนยันการจอง';
      }
    });

    init();
  </script>
</body>
</html>
